<!DOCTYPE html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StrathCuboid Robot</title>
  <link rel="stylesheet" type="text/css" href="/style.css">
</head>

<body>
  <h1>Hello from StrathCuboid</h1>
  <div class="split">
    <div class="container">
      <div></div>

      <button onclick="sendMovement('forward')">forward</button>

      <div></div>

      <button onclick="sendMovement('left')">left</button>
      <button onclick="sendMovement('stop')">stop</button>
      <button onclick="sendMovement('right')">right</button>

      <div></div>
      <button onclick="sendMovement('backward')">back</button>
      <div></div>
    </div>

    <div class=icon>
      <img src="/rover.png" style="max-width:15vw;">
    </div>

    <div class="container">
      <button></button>
      <button></button>
      <button></button>
      <button></button>
      <button></button>
      <button></button>
      <button></button>
      <button></button>
      <button></button>
    </div>
  </div>
  <p>Press a button or use WASD to move</p>
  <p id="status">Command: </p>
</body>

</html>


<script>
  async function sendMovement(direction) {
    document.getElementById("status").innerText = "Command: " + direction;
    console.log(`Sending movement: ${direction}`);
    await fetch(`/api/${direction}`, { method: "POST" });
  }

  document.addEventListener("keydown", async (event) => {
    switch (event.key) {
      case "a":
        await sendMovement("left");
        break;
      case "s":
        await sendMovement("backward");
        break;
      case "w":
        await sendMovement("forward");
        break;
      case "d":
        await sendMovement("right");
        break;
    }
  });
  document.addEventListener("keyup", async (event) => {
    if (["a", "s", "w", "d"].includes(event.key)) {
      await sendMovement("stop");
    }
  });

</script>
