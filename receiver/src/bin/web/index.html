<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
  }

  .container {
    display: grid;
    grid-template-columns: auto auto auto;
    gap: 10px;
    margin: 0 auto;
    width: 300px;
  }

  .container button {
    font-size: 1.5em;
    display: grid;
    place-items: center;
    width: 100px;
    height: 100px;
  }
</style>

<script>
  async function sendMovement(direction) {
    document.getElementById("status").innerText = "Command: " + direction;
    console.log(`Sending movement: ${direction}`);
    await fetch(`/api/${direction}`, { method: "POST" });
  }

  document.addEventListener("keydown", async (event) => {
    switch (event.key) {
      case "a":
        await sendMovement("left");
        break;
      case "s":
        await sendMovement("backward");
        break;
      case "w":
        await sendMovement("forward");
        break;
      case "d":
        await sendMovement("right");
        break;
    }
  });
  document.addEventListener("keyup", async (event) => {
    await sendMovement("stop");
  });

</script>
