<!DOCTYPE html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32 Robot</title>
</head>

<body>
  <h1>Hello from ESP32-C3</h1>
  <form action="/left" method="GET">
    <button type="submit" style="font-size:1.5rem;padding:0.6rem 1.4rem">left</button>
  </form>

  <form action="/right" method="GET">
    <button type="submit" style="font-size:1.5rem;padding:0.6rem 1.4rem">right</button>
  </form>

  <form action="/forward" method="GET">
    <button type="submit" style="font-size:1.5rem;padding:0.6rem 1.4rem">forward</button>
  </form>

  <form action="/back" method="GET">
    <button type="submit" style="font-size:1.5rem;padding:0.6rem 1.4rem">back</button>
  </form>
</body>

</html>
